# Local development override (auto-loaded by `docker compose`).
# Builds the image from this checkout so `docker compose up -d --build`
# uses local code instead of pulling ghcr.io.
services:
  opencode2api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ${BUILD_HTTP_PROXY:-http://10.147.20.3:7890}
        HTTPS_PROXY: ${BUILD_HTTPS_PROXY:-http://10.147.20.3:7890}
    image: opencode2api:local
    pull_policy: never
